services:
  api:
    build: .
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: [local]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
volumes:
  ollama_models:
